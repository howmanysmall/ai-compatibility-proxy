name: Aube Install
description: Sets up mise, restores the aube store cache, and installs dependencies.

inputs:
  mise_install:
    description: Run mise install (disable in downstream jobs that only need the cached tools)
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      id: mise
      with:
        install: ${{ inputs.mise_install }}
        install_args: aube deno
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: cache
      with:
        path: |
          ~/.local/share/aube/store/v1
          ~/.cache/aube
        key: aube-${{ runner.os }}-${{ hashFiles('mise.lock', 'aube-lock.yaml', 'aube-workspace.yaml') }}
        restore-keys: |
          aube-${{ runner.os }}-${{ hashFiles('mise.lock') }}-
          aube-${{ runner.os }}-
    - run: |
        for attempt in 1 2 3; do
          if aube install --fix-lockfile; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            exit 1
          fi
          sleep $((attempt * 10))
        done
        git diff --exit-code package.json aube-lock.yaml
      shell: bash
