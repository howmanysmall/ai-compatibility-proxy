name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        id: install
        uses: ./.github/actions/aube-install
      - run: nr type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: nr oxlint --format github
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: nr biome ci --reporter github
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: nr format:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: nr test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
