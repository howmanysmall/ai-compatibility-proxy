[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[tools]
"github:howmanysmall/npm-registry-mcp" = "latest"
"github:howmanysmall/pullhook" = "latest"
aube = "latest"
bun = "latest"
flyctl = "latest"
gum = "latest"
hk = "latest"
jq = "latest"
pkl = "latest"
rumdl = "latest"
shfmt = "latest"
tombi = "latest"
deno = "latest"
zizmor = "latest"

[settings]
auto_install = false
lockfile = true

[hooks]
postinstall = "mise run bun-canary"

[tasks]
[tasks.bun-canary]
description = "Ensure the mise-managed Bun binary is a canary build"
run = """
#!/usr/bin/env bash
set -euo pipefail

current_revision="$(bun --revision)"
if [[ "$current_revision" == *"-canary."* ]]; then
	echo "$current_revision"
	exit 0
fi

bun upgrade --canary
bun --revision
"""

[tasks.live-smoke]
description = "Run repeatable live smoke tests for OpenCode Go and Cerebras proxy paths"
run = "mise x -- bun run --bun scripts/live-proxy-smoke.ts"

[tasks.bench-http]
alias = "bench"
description = "Run real localhost HTTP benchmarks and print a compare-ready report that is easy to read at a glance. Saves snapshots under benchmarks/results/."
dir = "."
env = { BENCH_LABEL = "default", CONCURRENCY = "50", DURATION = "10s", WARMUP_REQUESTS = "5" }
raw = true
run = "bun run --bun scripts/http-bench.ts run --label $BENCH_LABEL --duration $DURATION --concurrency $CONCURRENCY --warmup-requests $WARMUP_REQUESTS"

[tasks.bench-http-quick]
alias = "bench-quick"
description = "Run a short benchmark pass with a readable report for quick local comparisons."
dir = "."
raw = true
run = "bun run --bun scripts/http-bench.ts run --label quick --duration 2s --concurrency 10 --warmup-requests 2"

[tasks.bench-http-stress]
alias = "bench-stress"
description = "Run a longer benchmark pass with a readable report for higher-load comparisons."
dir = "."
raw = true
run = "bun run --bun scripts/http-bench.ts run --label stress --duration 15s --concurrency 50 --warmup-requests 10"

[tasks.open-latest-bench]
description = "Open the latest benchmark results in your browser."
run = """
#!/usr/bin/env bash

set -euo pipefail

if [[ ! -f benchmarks/results/latest-report.html ]]; then
	echo "error: no benchmark results found" >&2
	exit 1
fi

# check operating system

if [[ "$(uname)" == "Darwin" ]]; then
	open benchmarks/results/latest-report.html
elif command -v xdg-open &>/dev/null; then
	xdg-open benchmarks/results/latest-report.html
else
	echo "Please manually open benchmarks/results/latest-report.html"
fi
"""
run_windows = """
cmd /c start "" benchmarks\\results\\latest-report.html
"""

[tasks.health-check]
alias = "hc"
description = "Health check the running proxy. Exits 0 if status is ok, 1 otherwise."
env = { PORT = "8000" }
run = """
#!/usr/bin/env bash
set -euo pipefail

port="${PORT:-8000}"

if response=$(curl -sf "http://localhost:${port}/health" 2>/dev/null); then
	status=$(echo "$response" | jq -r '.status // empty' 2>/dev/null)
	if [ "$status" = "ok" ]; then
		exit 0
	fi
fi

exit 1
""""
