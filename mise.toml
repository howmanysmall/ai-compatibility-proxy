[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[tools]
"github:howmanysmall/npm-registry-mcp" = "latest"
"github:howmanysmall/pullhook" = "latest"
deno = "2.8.1"
gum = "latest"
hk = "latest"
ni = "latest"
pkl = "latest"
rumdl = "latest"
shfmt = "latest"
tombi = "latest"
jq = "latest"

[settings]
auto_install = false
lockfile = true

[tasks]
[tasks.ignore-skills]
description = "Ignores skills from the lockfile."
run = """
#!/usr/bin/env bash

set -euo pipefail

GITIGNORE_PATH=".gitignore"
SKILLS_LOCK_PATH="skills-lock.json"
SKILLS_DIR=".agents/skills"

version=$(jq -r '.version' "$SKILLS_LOCK_PATH")
if [[ "$version" != "1" ]]; then
	echo "error: unsupported skills-lock.json version: $version" >&2
	exit 1
fi

mapfile -t skill_names < <(jq -r '.skills | keys[]' "$SKILLS_LOCK_PATH")

added=0
for name in "${skill_names[@]}"; do
	line="${SKILLS_DIR}/${name}/"
	if ! grep -qxF "$line" "$GITIGNORE_PATH" 2> /dev/null; then
		printf '%s\n' "$line" >> "$GITIGNORE_PATH"
		((added++)) || true
	fi
done

if ((added > 0)); then
	echo "✔ Added ${added} skill(s) to .gitignore"
else
	echo "ℹ All skills already in .gitignore"
fi
"""

[tasks.live-smoke]
description = "Run repeatable live smoke tests for OpenCode Go and Cerebras proxy paths"
run = "mise x -- deno run --allow-net --allow-env --allow-read --allow-run scripts/live-proxy-smoke.ts"

[tasks.bench-http]
alias = "bench"
description = "Run real localhost HTTP benchmarks for /health, /v1/models, and /v1/chat/completions using oha against the proxy and a socat-backed mock upstream."
dir = "."
env = { DURATION = "10s", CONCURRENCY = "50", WARMUP_REQUESTS = "5" }
raw = true
run = "./scripts/benchmark-http.zsh"
shell = "zsh -uec"
sources = [
	"benchmarks/fixtures/chat-completions.json",
	"scripts/benchmark-http.zsh",
	"scripts/mock-upstream-handler.zsh",
]

[tasks.bench-http-quick]
alias = "bench-quick"
description = "Run a short real localhost HTTP benchmark pass with low concurrency for quick sanity checks and local comparisons."
dir = "."
env = { DURATION = "2s", CONCURRENCY = "10", WARMUP_REQUESTS = "2" }
raw = true
run = "./scripts/benchmark-http.zsh"
shell = "zsh -uec"
sources = [
	"benchmarks/fixtures/chat-completions.json",
	"scripts/benchmark-http.zsh",
	"scripts/mock-upstream-handler.zsh",
]

[tasks.bench-http-stress]
alias = "bench-stress"
description = "Run a longer real localhost HTTP benchmark pass with higher concurrency to pressure the proxy over /health, /v1/models, and /v1/chat/completions."
dir = "."
env = { DURATION = "15s", CONCURRENCY = "50", WARMUP_REQUESTS = "10" }
raw = true
run = "./scripts/benchmark-http.zsh"
shell = "zsh -uec"
sources = [
	"benchmarks/fixtures/chat-completions.json",
	"scripts/benchmark-http.zsh",
	"scripts/mock-upstream-handler.zsh",
]
