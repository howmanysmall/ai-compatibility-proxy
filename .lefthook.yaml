colors: true
commit-msg:
  commands:
    commitlint:
      run: mise x -- deno task commitlint --strict --config commitlint.config.ts --edit {1}

min_version: 2.0.0
output:
  - execution
  - summary

post-merge:
  commands:
    package-install:
      run: mise x -- pullhook --install

pre-commit:
  jobs:
    - glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
      name: js-ts-pipeline
      run: |
        mise x -- deno task oxlint --no-error-on-unmatched-pattern --fix {staged_files}
        mise x -- deno task biome lint --write --no-errors-on-unmatched {staged_files}
        mise x -- deno lint --fix --permit-no-files {staged_files}
        mise x -- deno task oxfmt --no-error-on-unmatched-pattern {staged_files}
        mise x -- deno fmt --permit-no-files {staged_files}
      stage_fixed: true

    - exclude:
        - package.json
      glob:
        - "*.css"
        - "*.html"
        - "*.json"
        - "*.jsonc"
        - "*.grit"
        - "*.code-workspace"
      name: biome-non-js
      run: |
        mise x -- deno task biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - glob:
        - "*.json5"
        - "*.mdx"
      name: oxfmt-json5-mdx
      run: |
        mise x -- deno task oxfmt -- --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - exclude:
        - .agents/skills/**/SKILL.md
      glob: "*.md"
      name: markdown
      run: |
        mise x -- rumdl check --fix {staged_files}
        mise x -- rumdl fmt {staged_files}
      stage_fixed: true
    - glob: "*.toml"
      name: toml
      run: |
        mise x -- tombi lint {staged_files}
        mise x -- tombi format {staged_files}
      stage_fixed: true
  parallel: true

pre-push:
  commands:
    lint:
      run: mise x -- deno task lint
    type-check:
      run: mise x -- deno check
  parallel: true
