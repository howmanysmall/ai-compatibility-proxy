app = "ai-compatibility-proxy"
primary_region = "dfw"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8000"
LOG_LEVEL = "info"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
