minimumReleaseAgeStrict: true
resolutionMode: time-based
strictStorePkgContentCheck: false # Vitiate's Optique dev tarballs have inconsistent build metadata.
strictDepBuilds: true # Fail on unreviewed build scripts
strictPeerDependencies: false
strictSsl: true # Prevent MITM attacks
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
verifyStoreIntegrity: true # Verify store files before linking
